name: Bug report
description: A model that errors, gives a wrong result, or a sign that looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead (wrong number, error, drawing).
    validations:
      required: true
  - type: textarea
    id: mwe
    attributes:
      label: Minimal model
      description: The smallest model that shows it, runnable from `using BondGraphToolkit`.
      render: julia
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `versioninfo()` and `using Pkg; Pkg.status()`.
      render: text
    validations:
      required: true
