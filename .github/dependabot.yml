version: 2
updates:
  # [compat] bounds of the package and the docs environment
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
